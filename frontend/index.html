<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#08090c">
    <meta name="description" content="多 WebDAV 视频流播放器">
    <title>WebSua · 视频流</title>

    <!-- 主题：先于样式执行，避免明暗切换闪白 -->
    <script>
        (function () {
            try {
                var mode = localStorage.getItem('websua.theme') || 'auto';
                var resolved = (mode === 'light' || mode === 'dark') ? mode
                    : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
                document.documentElement.dataset.theme = resolved;
                document.documentElement.dataset.themeMode = mode;
                document.querySelector('meta[name=theme-color]')
                    .setAttribute('content', resolved === 'light' ? '#f4f6fa' : '#08090c');
            } catch (e) { }
        })();
    </script>

    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/player.css">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%236C8CFF'/><text y='72' x='50' text-anchor='middle' font-size='62' font-family='sans-serif' font-weight='bold' fill='white'>W</text></svg>">
</head>
<body>
    <div class="app" id="app">
        <!-- 首屏骨架：JS 加载完成后被替换 -->
        <div style="display:grid;place-items:center;height:100dvh;gap:12px;color:var(--fg-3);font-family:system-ui">
            <div style="width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#6C8CFF,#A56CFF,#00D4C8)"></div>
            <div style="font-size:13px">正在加载…</div>
        </div>
    </div>

    <noscript>
        <div style="padding:40px;text-align:center;font-family:system-ui">
            WebSua 需要启用 JavaScript 才能运行。
        </div>
    </noscript>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
